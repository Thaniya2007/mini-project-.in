<!-- White Sharps Waste Graphic -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="whiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="whiteBinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadowWhite" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#whiteBg)"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- Translucent Sharps Container -->
  <g filter="url(#shadowWhite)">
    <!-- Container Body (translucent look) -->
    <path d="M 210 140 L 225 330 Q 225 338 235 338 L 365 338 Q 375 338 375 330 L 390 140 Z" fill="url(#whiteBinGrad)" stroke="#475569" stroke-width="3.5" opacity="0.95"/>
    
    <!-- Red/Orange Tamper-Proof Locking Lid -->
    <rect x="195" y="115" width="210" height="28" rx="8" fill="#f97316" stroke="#c2410c" stroke-width="3"/>
    
    <!-- Needle Drop Slot -->
    <rect x="255" y="123" width="90" height="12" rx="6" fill="#431407"/>

    <!-- Fill Line Level -->
    <line x1="220" y1="210" x2="380" y2="210" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="300" y="202" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">MAX FILL LEVEL (DO NOT EXCEED)</text>

    <!-- Sharps Biohazard Label -->
    <rect x="245" y="225" width="110" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="300" y="248" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#991b1b" text-anchor="middle">SHARPS</text>
    <text x="300" y="265" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">PUNCTURE PROOF</text>
    <text x="300" y="282" font-family="'Inter', sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">DO NOT RECAP NEEDLE</text>
  </g>

  <!-- Items: Syringe & Needle -->
  <g transform="translate(60, 180) rotate(-35)">
    <!-- Syringe Barrel -->
    <rect x="0" y="0" width="110" height="26" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2" opacity="0.95"/>
    <!-- Plunger -->
    <rect x="-35" y="6" width="35" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-42" y="2" width="7" height="22" rx="2" fill="#64748b"/>
    <!-- Scale lines -->
    <line x1="20" y1="0" x2="20" y2="10" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="10" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="10" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="10" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Metal Needle -->
    <rect x="110" y="9" width="12" height="8" fill="#94a3b8"/>
    <line x1="122" y1="13" x2="185" y2="13" stroke="#475569" stroke-width="2.5"/>
  </g>
  <text x="120" y="360" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Hypodermic Needles</text>

  <!-- Items: Scalpel & Surgical Blades -->
  <g transform="translate(450, 200) rotate(20)">
    <!-- Scalpel Handle -->
    <rect x="0" y="0" width="95" height="14" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <!-- Stainless steel blade -->
    <path d="M 95 3 L 135 1 Q 140 10 115 14 L 95 14 Z" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="490" y="360" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Scalpel &amp; Blades</text>

  <!-- Title Badge -->
  <rect x="20" y="20" width="310" height="42" rx="10" fill="#ffffff" opacity="0.95" stroke="#94a3b8" stroke-width="2"/>
  <text x="35" y="46" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#334155">WHITE: Sharps &amp; Metal Waste</text>
</svg>

