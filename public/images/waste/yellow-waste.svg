<!-- Yellow Waste Graphic -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#yellowBg)"/>
  
  <!-- Hospital Room Wall Floor Line -->
  <line x1="0" y1="320" x2="600" y2="320" stroke="#facc15" stroke-width="3" stroke-dasharray="8,6"/>
  
  <!-- Yellow Biohazard Bin -->
  <g filter="url(#shadow)">
    <!-- Bin Body -->
    <path d="M 190 140 L 210 330 Q 210 340 220 340 L 380 340 Q 390 340 390 330 L 410 140 Z" fill="url(#binGrad)" stroke="#a16207" stroke-width="4"/>
    
    <!-- Bin Lid & Handle -->
    <rect x="170" y="115" width="260" height="28" rx="8" fill="#ca8a04" stroke="#854d0e" stroke-width="3"/>
    <rect x="260" y="95" width="80" height="22" rx="6" fill="#a16207"/>
    
    <!-- Foot Pedal -->
    <rect x="270" y="340" width="60" height="12" rx="4" fill="#713f12"/>
    
    <!-- Biohazard Symbol on Bin -->
    <circle cx="300" cy="235" r="42" fill="#ffffff" opacity="0.9" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="300" cy="235" r="14" fill="#a16207"/>
    <circle cx="300" cy="222" r="8" fill="#fde047"/>
    <circle cx="289" cy="242" r="8" fill="#fde047"/>
    <circle cx="311" cy="242" r="8" fill="#fde047"/>
    <text x="300" y="270" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#713f12" text-anchor="middle" letter-spacing="1">BIOHAZARD</text>
  </g>

  <!-- Items: Dressings, Bandages, Flask -->
  <!-- Blood contaminated Cotton / Gauze Swab -->
  <g transform="translate(90, 240)">
    <ellipse cx="40" cy="40" rx="35" ry="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 25 35 Q 35 25 50 40 Q 60 50 45 55 Q 30 50 25 35 Z" fill="#b91c1c" opacity="0.85"/>
    <text x="40" y="80" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">Contaminated Gauze</text>
  </g>

  <!-- Expired Medicine Blister Pack -->
  <g transform="translate(420, 220)">
    <rect x="10" y="20" width="100" height="55" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="30" cy="38" r="8" fill="#dc2626"/>
    <circle cx="60" cy="38" r="8" fill="#dc2626"/>
    <circle cx="90" cy="38" r="8" fill="#dc2626"/>
    <circle cx="30" cy="58" r="8" fill="#f59e0b"/>
    <circle cx="60" cy="58" r="8" fill="#f59e0b"/>
    <circle cx="90" cy="58" r="8" fill="#f59e0b"/>
    <text x="60" y="95" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">Expired Medicines</text>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="20" width="280" height="42" rx="10" fill="#ffffff" opacity="0.95" stroke="#facc15" stroke-width="2"/>
  <text x="35" y="46" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#854d0e">YELLOW: Infectious &amp; Pathological</text>
</svg>

