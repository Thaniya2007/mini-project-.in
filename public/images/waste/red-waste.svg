<!-- Red Waste Graphic -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="redBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="redBinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadowRed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#redBg)"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#f87171" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- Red Waste Bin -->
  <g filter="url(#shadowRed)">
    <path d="M 190 140 L 210 330 Q 210 340 220 340 L 380 340 Q 390 340 390 330 L 410 140 Z" fill="url(#redBinGrad)" stroke="#991b1b" stroke-width="4"/>
    <rect x="170" y="115" width="260" height="28" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <rect x="260" y="95" width="80" height="22" rx="6" fill="#991b1b"/>
    <rect x="270" y="340" width="60" height="12" rx="4" fill="#450a0a"/>

    <!-- Recycling / Autoclave symbol -->
    <circle cx="300" cy="235" r="42" fill="#ffffff" opacity="0.95" stroke="#dc2626" stroke-width="3"/>
    <!-- Recycle arrows -->
    <path d="M 300 205 L 315 220 L 305 220 C 318 220 328 230 328 245 L 320 245 C 320 235 312 228 305 228 L 305 235 Z" fill="#b91c1c"/>
    <path d="M 325 248 L 315 260 L 318 266 C 308 274 294 272 284 262 L 278 268 C 291 280 310 282 323 271 L 328 277 Z" fill="#b91c1c"/>
    <path d="M 275 240 L 275 225 L 282 230 C 275 218 285 208 295 208 L 295 202 C 280 202 268 215 272 232 L 265 228 Z" fill="#b91c1c"/>
    <text x="300" y="270" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1">AUTOCLAVE</text>
  </g>

  <!-- Items: Disposable Nitrile Gloves -->
  <g transform="translate(60, 200)">
    <!-- Glove 1 -->
    <path d="M 30 70 C 20 40 40 20 50 20 C 55 20 55 40 60 40 C 65 30 75 30 75 45 C 80 35 90 40 88 55 C 93 45 102 50 98 65 C 90 90 70 110 50 110 C 30 110 35 90 30 70 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2" opacity="0.9"/>
    <text x="65" y="130" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Contaminated Gloves</text>
  </g>

  <!-- Items: IV Bag & Tubing -->
  <g transform="translate(430, 160)">
    <!-- Saline Bag -->
    <rect x="20" y="20" width="70" height="110" rx="14" fill="#ffffff" opacity="0.9" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="35" y="8" width="40" height="14" rx="4" fill="#cbd5e1"/>
    <line x1="30" y1="50" x2="80" y2="50" stroke="#38bdf8" stroke-width="2"/>
    <line x1="30" y1="70" x2="70" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="90" x2="65" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Tube -->
    <path d="M 55 130 Q 30 160 55 180 T 80 200" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <text x="55" y="145" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#0284c7" text-anchor="middle">0.9% NaCl</text>
    <text x="55" y="220" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">IV Infusion Sets</text>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="20" width="310" height="42" rx="10" fill="#ffffff" opacity="0.95" stroke="#f87171" stroke-width="2"/>
  <text x="35" y="46" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#991b1b">RED: Contaminated Recyclable Plastics</text>
</svg>

